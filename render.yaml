# ⚠️ CE FICHIER NE PILOTE RIEN. Ne pas l'éditer en croyant changer la production.
#
# Le service web « Qeerah » (srv-d828f6mgvqtc73dffglg) n'a PAS été créé depuis ce
# blueprint : il est configuré entièrement dans le dashboard Render. Constaté en
# juillet 2026 — la commande de build réellement exécutée diffère de celle écrite
# ici. Modifier ce fichier n'a donc AUCUN effet sur le service déployé.
#
# Il porte en plus des valeurs qui contredisent la production, ce qui a déjà induit
# en erreur :
#   • `name: tiktok-shop-analyzer` — le service s'appelle « Qeerah » ;
#   • `--workers 1` — la production tourne avec 2 workers ;
#   • les Cron Jobs (feed-radar-collect, upsell-j3) n'y figurent pas du tout, parce
#     qu'un Cron Job créé au dashboard n'apparaît jamais dans un blueprint. Ne
#     jamais conclure « le cron n'existe pas » depuis ce fichier.
#
# Conservé comme documentation de la configuration ATTENDUE, et comme point de
# départ si le service devait être recréé depuis un blueprint. Toute modification
# réelle passe par le dashboard Render.
#
# ── Configuration réelle, relevée au dashboard (à tenir à jour à la main) ──
#   Service web « Qeerah »
#     Start command : python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
#     Plan          : 2 Go RAM / 1 CPU
#   Cron « feed-radar-collect » : python3 cron_feed_radar.py    — "30 1,4 * * *" UTC
#   Cron « upsell-j3 »          : python3 cron_upsell.py        — quotidien
#     (⚠️ appelait auparavant la route HTTP via curl SANS -L : le 301
#      qeerah.com → www.qeerah.com n'était pas suivi et le job « réussissait »
#      sans rien envoyer. Cf. cron_upsell.py.)

services:
  - type: web
    name: tiktok-shop-analyzer
    runtime: python
    buildCommand: apt-get install -y ffmpeg && pip install -r requirements.txt
    # 1 worker : l'instance a 1 CPU (2 workers se marcheraient dessus et doubleraient
    # la RAM de base). L'app est async → la concurrence est préservée, et le worker
    # unique dispose de toute la RAM pour le traitement vidéo (uploads jusqu'à 300 Mo).
    startCommand: python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: dopeventures44@gmail.com
